# Build the site and publish it to GitHub Pages on every push to main.
#
# The build is the same `python scripts/build.py` you run locally. Processed
# image variants are cached between runs (keyed on the photographs and the
# image pipeline), so a push that changes only text rebuilds in seconds.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore the image cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: images-${{ hashFiles('content/**/*.jpg', 'content/**/*.jpeg', 'scripts/photosite/images.py') }}
          restore-keys: images-

      - run: pip install -r requirements.txt

      - run: python scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
